# Packages locally on the runner; never creates a tag or GitHub Release.
name: Release packaging validation
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build from clean committed source
        run: bash scripts/build-release.sh "v$(cat backend/shmax/VERSION)"
      - name: Verify checksums and archive contract
        run: python scripts/check-release.py dist-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shmax-release-candidate
          path: |
            dist-release/shmax-*.tar.gz
            dist-release/SHA256SUMS
            dist-release/release-manifest.json
            dist-release/build-info.json
