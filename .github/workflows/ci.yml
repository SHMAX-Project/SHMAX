name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Backend dependencies
        run: cd backend && python -m pip install -r requirements.lock && pip install --no-deps -e '.[dev]'
      - name: Full pytest
        run: cd backend && python -m pytest
      - name: Installer shell syntax
        run: bash -n deploy/installer/install.sh && bash -n scripts/build-release.sh
      - name: Documentation links
        run: python scripts/check-doc-links.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: cd frontend && npm ci
      - run: cd frontend && npx vitest run
      - run: cd frontend && npx tsc --noEmit
      - run: cd frontend && npm run build
      - name: Branding, screenshot provenance and license metadata
        run: python scripts/check-public-assets.py
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Redacted full-history secret scan (fail closed)
        run: bash scripts/scan-secrets.sh
